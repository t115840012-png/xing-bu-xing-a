<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>形不形啊｜畫畫接龍</title><link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap">
<header><div class="logo">形不形啊</div><p>把別人的畫變成線索，再用自己的想像接下去。</p></header>
<section id="home" class="panel">
  <h2>加入一場畫畫接龍</h2>
  <label>你的暱稱<input id="name" maxlength="16" placeholder="例如：小畫家"></label>
  <div class="actions"><button id="create">建立新房間</button></div>
  <div class="join"><input id="roomCode" maxlength="6" placeholder="輸入 6 位房間代碼"><button id="join">加入房間</button></div>
  <p class="hint">最多 8 人。建立房間的人可以設定時間與輪數。</p>
</section>
<section id="lobby" class="panel hidden">
  <h2>房間 <strong id="code"></strong></h2>
  <p>把房間代碼傳給朋友，只有知道代碼的人能加入。</p>
  <h3>玩家</h3><ul id="players"></ul>
  <div id="hostSettings" class="settings">
    <label>每人作畫時間<select id="seconds"><option value="30">30 秒</option><option value="60" selected>60 秒</option><option value="90">90 秒</option><option value="120">120 秒</option></select></label>
    <label>每人輪數<select id="rounds"><option value="1">1 輪</option><option value="2">2 輪</option><option value="3">3 輪</option><option value="4">4 輪</option></select></label>
    <button id="start">開始遊戲</button>
  </div>
  <p id="waiting" class="hint hidden">等待房主開始遊戲……</p>
</section>
<section id="game" class="panel hidden">
  <div class="gamehead"><div><span id="roundLabel"></span><h2 id="turnLabel">輪到你了！</h2></div><div class="timer" id="timer">60</div></div>
  <div id="promptBox" class="prompt hidden"><p>請根據上一位玩家留下的抽象線索創作：</p><img id="promptImage" alt="上一位玩家的抽象線索"></div>
  <p id="firstPrompt">沒有前一張線索，請自由畫下第一張作品！</p>
  <canvas id="canvas" width="900" height="520"></canvas>
  <div class="drawtools"><button id="clear" class="secondary">清空畫布</button><button id="submit">送出作品</button></div>
  <p class="hint">如果時間到了，系統會自動送出目前畫面。</p>
</section>
<section id="results" class="panel hidden"><h2>接龍完成！</h2><p>看看大家如何把線索變成新的想像。</p><div id="works" class="works"></div><button id="backHome">回到首頁</button></section>
<div id="notice" role="status"></div>
</main>
<script src="/socket.io/socket.io.js"></script><script src="/client.js"></script>
</body></html>
